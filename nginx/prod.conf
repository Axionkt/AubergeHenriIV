events {}

http {
  include /etc/nginx/mime.types;
  client_max_body_size 250M;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # ---------- REAL VISITOR IP (Cloudflare) ----------
  # Traffic reaches nginx from Cloudflare's servers. Trust the CF-Connecting-IP
  # header ONLY when the connection comes from a Cloudflare range, so nobody
  # connecting directly can spoof it. After this, $remote_addr is the visitor.
  # Source: https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6
  # Ranges rarely change, but re-check them now and then.
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  # Redirect HTTP to HTTPS
  server {
    listen 80;
    server_name yourdomain.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name yourdomain.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ---------- FRONTEND (static build) ----------
    location / {
      proxy_pass http://frontend:80/;
      proxy_set_header Host $host;
    }

    # ---------- BACKEND API ----------
    location /api/ {
      proxy_pass http://backend:3000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Overwrite (not append to) the incoming header so clients can't inject
      # fake addresses. The backend's `trust proxy 1` then reads this value.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }

    # ---------- PROTECTED FILES ----------
    location /internal/storage/ {
      internal;
      alias /var/www/storage/;
    }
  }
}