events {}

http {
  include /etc/nginx/mime.types;
  client_max_body_size 2m;
  server_tokens off;
  autoindex off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # ---------- REAL VISITOR IP (Cloudflare) ----------
  # Traffic reaches nginx from Cloudflare's servers. Trust the CF-Connecting-IP
  # header ONLY when the connection comes from a Cloudflare range, so nobody
  # connecting directly can spoof it. After this, $remote_addr is the visitor.
  # Source: https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6
  # Ranges rarely change, but re-check them now and then.
  # Also firewall ports 80/443 on the VPS to these ranges (see README), or
  # anyone who finds the server IP can bypass Cloudflare entirely.
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  # Redirect HTTP to HTTPS
  server {
    listen 80;
    server_name yourdomain.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name yourdomain.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---------- SECURITY HEADERS ----------
    # nginx only inherits add_header into locations that define none of
    # their own: if a location below ever adds a header, repeat these there.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Report-only first: check the browser console on every page, then
    # rename to Content-Security-Policy to enforce. The site loads nothing
    # from third parties (Google sign-in is a redirect, fonts are local).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Shared by both API locations below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite (not append to) the incoming header so clients can't inject
    # fake addresses. The backend's `trust proxy 1` then reads this value.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------- FRONTEND (static build) ----------
    location / {
      proxy_pass http://frontend:80/;
    }

    # ---------- BACKEND API ----------
    location /api/ {
      proxy_pass http://backend:3000/;
    }

    # ---------- BACKEND ADMIN API (media uploads only) ----------
    # 520m = the backend's 500 MB per-request total (schemas/media.ts) plus
    # multipart overhead. Streams straight to the backend's temp dir.
    location /api/admin/media/ {
      client_max_body_size 520m;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      client_body_timeout 300s;

      proxy_pass http://backend:3000/admin/media/;
    }

    # ---------- PROTECTED FILES ----------
    # Only reachable through the backend's X-Accel-Redirect after its
    # access check; direct requests get a 404.
    location /internal/storage/ {
      internal;
      alias /var/www/storage/;
    }
  }
}
