server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Vite fingerprints asset filenames, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must always be revalidated, or browsers keep loading the
  # previous deploy's asset hashes (which no longer exist) after an update.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback: unknown paths are client-side routes.
  location / {
    try_files $uri /index.html;
  }
}
